<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visual Sudoku</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="app-header">
            <div>
                <p class="eyebrow">VISUAL PUZZLE</p>
                <h1>Visual Sudoku</h1>
                <p class="subtitle">
                    A beautiful way to solve Sudoku.
                </p>
            </div>

            <button id="newGameBtn" class="primary-button">
                New Game
            </button>
        </header>


        <!-- Controls -->
        <section class="controls">

            <div class="control-group">
                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>
                        Medium
                    </option>
                    <option value="hard">Hard</option>
                </select>
            </div>


            <div class="control-group">
                <label for="theme">
                    Theme
                </label>

                <select id="theme">
                    <option value="fruits">
                        Fruits
                    </option>

                    <option value="flowers">
                        Flowers
                    </option>
                </select>
            </div>


            <div class="timer-box">
                <span class="timer-label">TIME</span>
                <strong id="timer">00:00</strong>
            </div>

        </section>


        <!-- Game -->
        <section class="game-area">

            <div
                id="sudokuBoard"
                class="sudoku-board"
                aria-label="Sudoku board"
            ></div>

            <div class="game-actions">

                <button
                    id="hintBtn"
                    class="secondary-button"
                >
                    💡 Hint
                </button>

                <button
                    id="restartBtn"
                    class="secondary-button"
                >
                    ↻ Restart
                </button>

            </div>

            <p id="message" class="message"></p>

        </section>


        <!-- Number / symbol palette -->
        <section class="palette-section">

            <p class="palette-title">
                Choose a symbol
            </p>

            <div
                id="symbolPalette"
                class="symbol-palette"
            ></div>

        </section>


        <!-- Win Modal -->
        <div
            id="winModal"
            class="modal hidden"
        >
            <div class="modal-content">

                <div class="win-icon">
                    ✨
                </div>

                <h2>Puzzle Complete!</h2>

                <p>
                    Beautifully solved. 🌸
                </p>

                <p>
                    Time:
                    <strong id="finalTime">
                        00:00
                    </strong>
                </p>

                <button
                    id="nextGameBtn"
                    class="primary-button"
                >
                    New Puzzle
                </button>

            </div>
        </div>

    </main>


    <script src="js/sudoku.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
